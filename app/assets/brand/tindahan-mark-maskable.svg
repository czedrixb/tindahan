<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tindahan">
  <!-- Maskable variant of tindahan-mark.svg: full-bleed background (the OS
       applies its own mask/rounding) with the same storefront content group
       scaled 0.78x about the center so every corner stays inside the ~80%
       maskable safe zone. Keep the storefront group's coordinates identical
       to tindahan-mark.svg's #storefront group - copy changes across both. -->
  <rect x="0" y="0" width="100" height="100" fill="#345b46" />

  <g transform="translate(50,50) scale(0.78) translate(-50,-50)">
    <rect x="18" y="79" width="64" height="3" rx="1.5" fill="#16271d" opacity="0.25" />

    <rect x="20" y="46" width="60" height="32" rx="3" fill="#faf9f6" />

    <clipPath id="awning-clip-maskable">
      <rect x="16" y="28" width="68" height="18" rx="3" />
    </clipPath>
    <g clip-path="url(#awning-clip-maskable)">
      <rect x="16" y="28" width="68" height="18" fill="#faf9f6" />
      <rect x="16" y="28" width="13.6" height="18" fill="#d97706" />
      <rect x="43.2" y="28" width="13.6" height="18" fill="#d97706" />
      <rect x="70.4" y="28" width="13.6" height="18" fill="#d97706" />
    </g>
    <circle cx="22.8" cy="46" r="3.4" fill="#d97706" />
    <circle cx="36.4" cy="46" r="3.4" fill="#faf9f6" />
    <circle cx="50" cy="46" r="3.4" fill="#d97706" />
    <circle cx="63.6" cy="46" r="3.4" fill="#faf9f6" />
    <circle cx="77.2" cy="46" r="3.4" fill="#d97706" />

    <rect x="25" y="57" width="15" height="21" rx="2" fill="#2a4a39" />
    <circle cx="37" cy="68" r="1.3" fill="#faf9f6" />

    <rect x="50" y="57" width="24" height="14" rx="2" fill="#ffffff" />
    <rect x="52" y="63.5" width="20" height="1.4" rx="0.7" fill="#bfd2c6" />
    <rect x="53" y="65" width="7" height="5" rx="1" fill="#d97706" />
    <rect x="62" y="65" width="8" height="5" rx="1" fill="#4a7159" />
  </g>
</svg>
